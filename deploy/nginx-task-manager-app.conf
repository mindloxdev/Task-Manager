# Template. deploy/install.sh fills in @PORT@ and installs this as
# /etc/nginx/snippets/task-manager-app.conf, shared by the http bootstrap site
# and the https site so the two route requests identically.

client_max_body_size 12m;       # attachments are capped at MAX_UPLOAD_MB (10) by the app
proxy_read_timeout   120s;      # report exports
proxy_send_timeout   120s;

# Throttle password guessing before it reaches Node: sign-in is a POST to
# /login (a server action). Burst 10, then 1 every 6s per address; page loads
# (GET) are not counted. The app has its own limiter as well.
location = /login {
    limit_req zone=task_manager_login burst=10 nodelay;
    limit_req_status 429;
    include snippets/task-manager-proxy.conf;
}

location / {
    include snippets/task-manager-proxy.conf;
}

access_log /var/log/nginx/task-manager.access.log;
error_log  /var/log/nginx/task-manager.error.log;
