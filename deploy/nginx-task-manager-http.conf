# Template, stage 1 of 2. deploy/install.sh fills in @DOMAIN@ and installs this
# as /etc/nginx/sites-available/task-manager until a certificate exists.
# Serves the ACME challenge for certbot (and the app over plain http meanwhile;
# sign-in needs https, because the session cookie is Secure).
map $request_method $task_manager_login_key {
    POST    $binary_remote_addr;
    default "";                 # an empty key is never limited
}
limit_req_zone $task_manager_login_key zone=task_manager_login:1m rate=10r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name @DOMAIN@;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    include snippets/task-manager-app.conf;
}
