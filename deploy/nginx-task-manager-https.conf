# Template, stage 2 of 2. deploy/install.sh fills in @DOMAIN@ and installs this
# as /etc/nginx/sites-available/task-manager once the certificate exists.
#
# Port 80 does two things only: answers certbot's renewal checks, and sends
# everyone else to https.
map $request_method $task_manager_login_key {
    POST    $binary_remote_addr;
    default "";                 # an empty key is never limited
}
limit_req_zone $task_manager_login_key zone=task_manager_login:1m rate=10r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name @DOMAIN@;

    # Renewals run over http; this must stay reachable and must not redirect,
    # or renewal fails 90 days from now with nobody watching.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://@DOMAIN@$request_uri; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name @DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;

    # Mozilla "intermediate": every browser from recent years, nothing weak.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:task_manager_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Browsers remember to use https for this name for six months. No
    # includeSubDomains: other names under the domain are not ours to decide.
    add_header Strict-Transport-Security "max-age=15552000" always;

    include snippets/task-manager-app.conf;
}
