# Template. deploy/install.sh fills in @PORT@ and installs this as
# /etc/nginx/snippets/task-manager-proxy.conf.
proxy_pass http://127.0.0.1:@PORT@;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP         $remote_addr;
# Replaced, not appended: the app rate-limits sign-in by the first address in
# this header, so a client must not be able to choose it.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header Connection        "";
